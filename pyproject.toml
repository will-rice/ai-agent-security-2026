[project]
name = "jed_attack"
version = "0.1.0"
description = "A general template for AI agent harness bootstrapping."
readme = "README.md"
authors = [{ name = "Will Rice", email = "wrice20@gmail.com" }]
requires-python = ">=3.12"
dependencies = [
  "aicomp-sdk",
  "huggingface-hub>=0.27.0",
  "openai>=2.45.0",
  "pre-commit>=4.1.0",
  "pydantic>=2.12.2",
  "pydocstyle>=6.3.0",
  "pytest>=8.3.4",
  "python-dotenv>=1.1.1",
  "ruff>=0.9.7",
  "ty>=0.0.18",
  "wandb>=0.18.0",
]

[project.scripts]
jed-optimize = "jed_attack.campaign.launch:main"

[project.optional-dependencies]
gpu = ["llama-cpp-python>=0.3.0"]

[build-system]
requires = ["uv_build>=0.9.2"]
build-backend = "uv_build"

[tool.uv.build-backend]
module-name = ["jed_attack"]

[tool.uv.sources]
aicomp-sdk = { path = "vendor/aicomp_sdk-3.1.2-py3-none-any.whl" }

[tool.ruff.lint.isort]
known-first-party = ["jed_attack"]

[tool.ruff.lint]
select = ["C", "E", "F", "I", "W", "D", "N", "B", "PTH", "ANN"]
ignore = ["D107"]
exclude = [".venv"]

[tool.ruff.lint.pydocstyle]
convention = "google"

[tool.pytest.ini_options]
filterwarnings = ["ignore::DeprecationWarning"]

[tool.ty.src]
exclude = ["docs/**", ".superpowers/**", "vendor/**"]
