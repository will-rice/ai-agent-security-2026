# This workflow will install Python dependencies, run tests and lint with a variety of Python versions
# For more information see: https://docs.github.com/en/actions/automating-builds-and-tests/building-and-testing-python

name: Python package

on:
  push:
    branches: ["main"]
  pull_request:
    branches: ["main"]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.12"]

    steps:
      - uses: actions/checkout@v5
      - name: Set up Python ${{ matrix.python-version }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ matrix.python-version }}

      - name: Set up Node.js
        uses: actions/setup-node@v5
        with:
          node-version: "24.4"

      - name: Install prettier and toml plugin
        run: npm install prettier prettier-plugin-toml

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh

      # The SDK wheel is gitignored (rebuilt from competition data), and
      # aicomp-sdk is a path dependency, so uv sync fails without it.
      - name: Rebuild vendored SDK wheel from Kaggle
        env:
          KAGGLE_API_TOKEN: ${{ secrets.KAGGLE_API_TOKEN }}
          COMPETITION: ai-agent-security-multi-step-tool-attacks
        run: |
          uvx kaggle competitions download "$COMPETITION" -p vendor/
          unzip -o -q "vendor/$COMPETITION.zip" -d vendor/bundle
          # Deterministic wheel build (fixed timestamps + ZIP_STORED) so the CI-rebuilt
          # wheel is byte-identical to the locally-built one uv.lock pins its hash to.
          # A non-deterministic zip (mtimes, zlib-version DEFLATE) caused "Hash mismatch
          # for aicomp-sdk" on every run. Same script runs locally when re-locking.
          python3 scripts/build_vendor_wheel.py vendor/bundle vendor/aicomp_sdk-3.1.2-py3-none-any.whl

      - name: Run pre-commit hook
        run: |
          uv run pre-commit run -a
