genuinely different FAST-firing shapes AS YOU CAN, filling the messages array from its minItems
floor all the way UP TOWARD its maxItems cap -- more distinct shapes is STRICTLY BETTER:
extra shapes are FREE (they never cost throughput) and hedge the blind private board. FOLLOW
THE SCHEMA: author at least the floor, and push toward the cap. Never author address
variants of one shape (they collapse to one). Output a single JSON object
{"submissions": [ <Submission>, ... ]}. Each Submission is scored and shipped WHOLE: its
