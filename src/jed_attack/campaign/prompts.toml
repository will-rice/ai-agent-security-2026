You do NOT need to enumerate addresses -- one exemplar per distinct SHAPE is enough. The
active optimizer objective is the MIN over the two per-model boards (so a shape MUST fire
on BOTH gpt_oss and gemma to score -- covering only one model is bounded by the dead one),
